<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
   content="width=device-width,
   initial-scale=1.0" />
  <title>QuickShop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    body {
      background: #f8fafc;
      color: #1e293b;
      padding-bottom: 70px;
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content:
        space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 1.2rem;
    }
    .header-btns button {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .admin-btn {
      background: #475569 !important;
      margin-right: 6px;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill,
        minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px
        rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #e2e8f0;
    }
    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-body h3 {
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .card-body .price {
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 12px;
    }
    .card-body button {
      margin-top: auto;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    /* Modal / Drawer */
    .drawer {
      display: none;
      position: fixed;
      inset: 0;
      background:
        rgba(0,0,0,0.5);
      justify-content: flex-end;
      z-index: 20;
    }
    .drawer.active {
      display: flex;
    }
    .drawer-content {
      background: #fff;
      width: 100%;
      max-width: 360px;
      height: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .drawer-header {
      display: flex;
      justify-content:
        space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .cart-item {
      display: flex;
      justify-content:
        space-between;
      align-items: center;
      border-bottom: 1px solid
        #e2e8f0;
      padding: 8px 0;
    }
    .qty-ctrl button {
      padding: 2px 7px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      cursor: pointer;
    }
    .form-group {
      margin-top: 10px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }
    .checkout-btn {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>MyStore</h1>
  <div class="header-btns">
    <button class="admin-btn"
      onclick="openAdmin()">
      ⚙ Owner Admin
    </button>
    <button onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<main class="container">
  <div class="grid" id="productGrid">
  </div>
</main>

<!-- CART DRAWER -->
<div class="drawer" id="cartDrawer">
  <div class="drawer-content">
    <div class="drawer-header">
      <h2>Your Cart</h2>
      <button class="close-btn"
        onclick="closeCart()">
        &times;
      </button>
    </div>
    <div id="cartItems"
      style="flex-grow:1;"></div>
    
    <div style="margin-top: 10px;
      font-weight: bold;
      font-size: 1.1rem;">
      Total: <span id="cartTotal">0</span>
    </div>

    <div class="form-group">
      <label>Your Name</label>
      <input type="text"
        id="custName"
        placeholder="Jane Doe">
    </div>
    <div class="form-group">
      <label>Delivery Address</label>
      <textarea id="custAddr"
        rows="2"
        placeholder="Street, City"></textarea>
    </div>

    <button class="checkout-btn"
      onclick="checkoutWhatsApp()">
      Order via WhatsApp 💬
    </button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="drawer" id="adminModal">
  <div class="drawer-content">
    <div class="drawer-header">
      <h2>Store Manager</h2>
      <button class="close-btn"
        onclick="closeAdmin()">
        &times;
      </button>
    </div>

    <h3>Store Settings</h3>
    <div class="form-group">
      <label>WhatsApp Number
        (with country code, e.g. 1234567890)</label>
      <input type="text"
        id="ownerPhone">
    </div>
    <div class="form-group">
      <label>Currency Symbol ($ / € / £)</label>
      <input type="text"
        id="ownerCurrency"
        value="$">
    </div>
    <button onclick="saveSettings()"
      style="margin: 8px 0;
      padding: 6px 10px;
      cursor: pointer;">
      Save Settings
    </button>

    <hr style="margin: 14px 0;">

    <h3>Add Product</h3>
    <div class="form-group">
      <label>Product Title</label>
      <input type="text"
        id="newTitle"
        placeholder="Product name">
    </div>
    <div class="form-group">
      <label>Price</label>
      <input type="number"
        id="newPrice"
        step="0.01"
        placeholder="25.00">
    </div>
    <div class="form-group">
      <label>Image URL</label>
      <input type="url"
        id="newImg"
        placeholder="https://...">
    </div>
    <button onclick="addProduct()"
      style="margin-top: 10px;
      background: #2563eb;
      color:#fff;
      padding: 8px;
      border:none;
      border-radius:4px;
      cursor:pointer;">
      + Add Product
    </button>

    <hr style="margin: 14px 0;">
    <h3>Current Products</h3>
    <div id="adminProductList"
      style="margin-top: 8px;"></div>
  </div>
</div>

<script>
// Initial defaults
const DEFAULT_PRODUCTS = [
  {
    id: 1,
    title: "Casual T-Shirt",
    price: 19.99,
    image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300"
  },
  {
    id: 2,
    title: "Running Sneakers",
    price: 59.99,
    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"
  }
];

// Load data from localStorage
let storeConfig = JSON.parse(
  localStorage.getItem("storeConfig")
) || {
  phone: "15551234567",
  currency: "$"
};

let products = JSON.parse(
  localStorage.getItem("products")
) || DEFAULT_PRODUCTS;

let cart = [];

function saveStore() {
  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );
  localStorage.setItem(
    "storeConfig",
    JSON.stringify(storeConfig)
  );
}

// Render products for customers
function renderProducts() {
  const grid = document.getElementById(
    "productGrid"
  );
  grid.innerHTML = "";
  products.forEach(p => {
    const card = document.createElement(
      "div"
    );
    card.className = "card";
    card.innerHTML = `
      <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.title}" />
      <div class="card-body">
        <h3>${p.title}</h3>
        <div class="price">${storeConfig.currency}${p.price.toFixed(2)}</div>
        <button onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// Cart functions
function addToCart(id) {
  const prod = products.find(p => p.id === id);
  if (!prod) return;
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ ...prod, qty: 1 });
  }
  updateCartUI();
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(c => c.id !== id);
  }
  updateCartUI();
}

function updateCartUI() {
  const countSpan = document.getElementById("cartCount");
  const list = document.getElementById("cartItems");
  const totalSpan = document.getElementById("cartTotal");

  const totalQty = cart.reduce((acc, c) => acc + c.qty, 0);
  const totalPrice = cart.reduce(
    (acc, c) => acc + c.qty * c.price,
    0
  );

  countSpan.textContent = totalQty;
  totalSpan.textContent = `${storeConfig.currency}${totalPrice.toFixed(2)}`;

  list.innerHTML = "";
  cart.forEach(item => {
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div>
        <strong>${item.title}</strong><br>
        <small>${storeConfig.currency}${item.price.toFixed(2)} x ${item.qty}</small>
      </div>
      <div class="qty-ctrl">
        <button onclick="changeQty(${item.id}, -1)">-</button>
        <span style="margin: 0 4px;">${item.qty}</span>
        <button onclick="changeQty(${item.id}, 1)">+</button>
      </div>
    `;
    list.appendChild(div);
  });
}

// WhatsApp redirect logic
function checkoutWhatsApp() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }
  const name = document.getElementById("custName").value.trim();
  const address = document.getElementById("custAddr").value.trim();

  if (!name || !address) {
    alert("Please fill in your name and delivery address.");
    return;
  }

  const grandTotal = cart.reduce(
    (acc, c) => acc + c.qty * c.price,
    0
  );

  let message = `*NEW ORDER - MyStore*\n\n`;
  message += `*Customer Details:*\n`;
  message += `👤 Name: ${name}\n`;
  message += `📍 Address: ${address}\n\n`;
  message += `*Order Items:*\n`;

  cart.forEach((c, idx) => {
    const lineTotal = (c.qty * c.price).toFixed(2);
    message += `${idx + 1}. ${c.title} x${c.qty} - ${storeConfig.currency}${lineTotal}\n`;
  });

  message += `\n*Grand Total:* ${storeConfig.currency}${grandTotal.toFixed(2)}`;

  const cleanPhone = storeConfig.phone.replace(/[^0-9]/g, "");
  const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
  
  window.open(waUrl, "_blank");
}

// Drawer controls
function openCart() {
  document.getElementById("cartDrawer").classList.add("active");
}
function closeCart() {
  document.getElementById("cartDrawer").classList.remove("active");
}

// Admin Panel Logic
function openAdmin() {
  document.getElementById("ownerPhone").value = storeConfig.phone;
  document.getElementById("ownerCurrency").value = storeConfig.currency;
  renderAdminProducts();
  document.getElementById("adminModal").classList.add("active");
}
function closeAdmin() {
  document.getElementById("adminModal").classList.remove("active");
}

function saveSettings() {
  storeConfig.phone = document.getElementById("ownerPhone").value.trim();
  storeConfig.currency = document.getElementById("ownerCurrency").value.trim() || "$";
  saveStore();
  renderProducts();
  updateCartUI();
  alert("Settings saved!");
}

function addProduct() {
  const title = document.getElementById("newTitle").value.trim();
  const price = parseFloat(document.getElementById("newPrice").value);
  const image = document.getElementById("newImg").value.trim();

  if (!title || isNaN(price)) {
    alert("Please provide at least a title and valid price.");
    return;
  }

  products.push({
    id: Date.now(),
    title,
    price,
    image: image || "https://via.placeholder.com/300"
  });

  saveStore();
  renderProducts();
  renderAdminProducts();

  // Clear inputs
  document.getElementById("newTitle").value = "";
  document.getElementById("newPrice").value = "";
  document.getElementById("newImg").value = "";
}

function deleteProduct(id) {
  if (confirm("Delete this product?")) {
    products = products.filter(p => p.id !== id);
    saveStore();
    renderProducts();
    renderAdminProducts();
  }
}

function renderAdminProducts() {
  const container = document.getElementById("adminProductList");
  container.innerHTML = "";
  products.forEach(p => {
    const row = document.createElement("div");
    row.style.display = "flex";
    row.style.justifyContent = "space-between";
    row.style.marginBottom = "6px";
    row.innerHTML = `
      <span>${p.title} (${storeConfig.currency}${p.price.toFixed(2)})</span>
      <button onclick="deleteProduct(${p.id})" style="color:red; background:none; border:none; cursor:pointer;">Remove</button>
    `;
    container.appendChild(row);
  });
}

// Initialize
renderProducts();
updateCartUI();
</script>

</body>
</html>
